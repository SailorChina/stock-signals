[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-signals"
version = "2.9.3"
description = "Multi-market stock technical analysis and buy/sell signal generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SailorChina"}]
keywords = ["stock", "technical-analysis", "signals", "futu", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "futu-api>=10.4.6408",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
stock-signals = "stock_signals.cli:main"

[tool.setuptools.packages.find]
include = ["stock_signals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
